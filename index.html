<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      name="description"
      content="StocksHub 个人 A 股研究工作台：自选、历史行情、研究日志与到期复盘。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://qt.gtimg.cn https://smartbox.gtimg.cn https://web.ifzq.gtimg.cn; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" content="#f4f6f5" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <title>StocksHub · 个人研究工作台</title>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到内容</a>
    <aside class="sidebar">
      <a class="brand" href="#watchlist" aria-label="StocksHub 首页">
        <img src="./assets/favicon.svg" width="32" height="32" alt="" />
        <span>StocksHub<small>个人研究工作台</small></span>
      </a>
      <div class="nav-label">研究空间</div>
      <nav aria-label="主导航">
        <a href="#watchlist" data-nav="watchlist"
          ><span data-icon="watch"></span>自选研究<span class="nav-count" id="watch-count"
            >0</span
          ></a
        >
        <a href="#journals" data-nav="journals"
          ><span data-icon="book"></span>研究日志<span class="nav-count" id="journal-count"
            >0</span
          ></a
        >
        <a href="#reviews" data-nav="reviews"
          ><span data-icon="check"></span>复盘队列<span class="nav-count" id="due-count">0</span></a
        >
        <a href="#data" data-nav="data"><span data-icon="database"></span>数据与备份</a>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot"></span><strong id="storage-mode">正在连接本地数据</strong>
        <p id="storage-hint">研究有依据，判断可回看。</p>
        <div class="edition">STOCKSHUB / RESEARCH EDITION</div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span class="workspace-label">我的研究空间 <span>/ A 股</span></span>
        <div class="search-box" id="search-box">
          <span data-icon="search"></span>
          <label class="sr-only" for="stock-search">搜索 A 股代码、名称或拼音</label>
          <input
            id="stock-search"
            type="search"
            placeholder="搜索代码、名称或拼音"
            autocomplete="off"
            maxlength="80"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
          />
          <kbd>/</kbd>
          <div id="search-results" class="search-results" role="listbox" hidden></div>
        </div>
        <a class="button primary top-new" href="#new"><span data-icon="plus"></span>新建研究</a>
      </header>
      <main id="main" tabindex="-1" aria-busy="true">
        <div class="loading-state">正在读取研究工作台…</div>
      </main>
      <footer class="page-footer">
        <span>数据有时间，判断有记录。</span><span>行情仅供研究 · 涨红跌绿 · 北京时间</span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./assets/app.js"></script>
    <noscript><p>请启用 JavaScript，以读取行情和本地研究日志。</p></noscript>
  </body>
</html>
